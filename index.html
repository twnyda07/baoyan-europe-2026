<style>
  :root{ --green:#1F5136; --green-d:#123527; --leaf:#4E8C5A; --pale:#A8D5A2;
         --bean:#D6E7D2; --paper:#F2F8F0; --ink:#16261D; --soft:#41584A; --line:#B9D3BB; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
        background:linear-gradient(160deg,#E4F0E1 0%,var(--bean) 100%); color:var(--ink);
        font-family:"PingFang TC","Noto Sans TC","Heiti TC","Microsoft JhengHei",system-ui,sans-serif;
        padding:24px; font-size:20px; }
  .gate{ width:100%; max-width:520px; background:var(--paper); border:1px solid var(--line);
         border-radius:18px; padding:44px 34px; box-shadow:0 10px 40px rgba(20,70,45,.16);
         text-align:center; border-top:6px solid var(--leaf); }
  .mark{ font-size:16px; letter-spacing:.32em; color:var(--leaf); margin-bottom:16px; }
  h1{ font-size:31px; line-height:1.45; margin:0 0 12px; color:var(--green); font-weight:700; }
  .sub{ font-size:19px; color:var(--soft); margin:0 0 32px; line-height:1.8; }
  label{ display:block; font-size:20px; margin-bottom:10px; text-align:left; }
  input{ width:100%; font-size:24px; padding:16px; border:2px solid var(--line); border-radius:10px;
         text-align:center; letter-spacing:.08em; background:#fff; color:var(--ink); }
  input:focus{ outline:none; border-color:var(--green); }
  button{ width:100%; margin-top:20px; font-size:22px; padding:16px; border:0; border-radius:10px;
          background:var(--green); color:#fff; cursor:pointer; font-weight:600; font-family:inherit; }
  button:hover{ background:var(--green-d); }
  button:disabled{ background:#8FAE99; cursor:default; }
  .msg{ margin-top:20px; font-size:19px; min-height:28px; }
  .msg.err{ color:#A3341F; }
  .msg.wait{ color:var(--soft); }
  .foot{ margin-top:28px; font-size:16px; color:var(--soft); line-height:1.8; }
</style>
